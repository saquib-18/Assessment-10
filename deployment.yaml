apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agri-deployment
  labels:
    app: smart-agri
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-agri
  template:
    metadata:
      labels:
        app: smart-agri
    spec:
      containers:
      - name: smart-agri-container
        image: saquib2006/smart-agri-app:invalid-tag
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agri-service
spec:
  type: NodePort
  selector:
    app: smart-agri
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080